<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casa em linhas</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #f6f6f4;
      overflow: hidden;
    }

    canvas {
      display: block;
    }

    #replay {
      position: fixed;
      left: 16px;
      bottom: 16px;
      padding: 8px 14px;
      font: 14px system-ui, sans-serif;
      color: #1c1c1e;
      background: #fff;
      border: 1px solid #1c1c1e;
      border-radius: 4px;
      cursor: pointer;
    }

    #replay:focus-visible {
      outline: 2px solid #1c1c1e;
      outline-offset: 2px;
    }
  </style>
  <script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.168.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.168.0/examples/jsm/"
} }
</script>
</head>

<body>
  <button id="replay" type="button">Montar de novo</button>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ---------------------------------------------------------------- ajustes
    const ARQUIVO_GLB = './casa_corrigida.glb';       // exportado do Blender com "Custom Properties" marcado
    const COR_LINHA = 0x3a2a1a;      // marrom escuro, mesma família dos galhos da coroa da logo
    const COR_LINHA_VIDRO = 0x3d5a73; // azul petróleo, ecoa o texto "DOMO" da logo
    const COR_FACE = 0xf7f1e4;       // creme quente, tom do fundo/flores da logo
    const ANGULO_ARESTA = 12;               // graus; arestas mais suaves que isso não viram linha
    const DURACAO_PECA = 1.1;               // segundos que cada peça leva para encaixar
    const ATRASO_POR_ORDEM = 0.55;          // segundos entre um grupo e o próximo
    const FATOR_EXPLOSAO = 1.0;
    const ARQUIVO_LOGO = '/images/logo-domo-otimizado.png';
    const DURACAO_LOGO = 2.0;               // segundos que a logo leva pra chegar
    const DIST_LOGO_ATRAS = 8;              // unidades atrás da câmera, no início
    const DIST_LOGO_FRENTE = 14;            // unidades à frente da câmera, no destino
    const ESCALA_LOGO = 3.5;                // largura da logo na cena (altura segue a proporção real)
    const reduzirMovimento = matchMedia('(prefers-reduced-motion: reduce)').matches;

    // ------------------------------------------------------------------ cena
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const cena = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 200);
    camera.position.set(22, 16, -24);

    const controles = new OrbitControls(camera, renderer.domElement);
    controles.target.set(0, 3.5, 0);
    controles.enableDamping = true;

    // material branco chapado; o polygonOffset empurra as faces um pouco para trás
    // para as linhas não brigarem com elas (z-fighting)
    const matFace = new THREE.MeshBasicMaterial({
      color: COR_FACE, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
    });
    const matVidro = matFace.clone();
    matVidro.transparent = true;
    matVidro.opacity = 0.35;
    const matLinha = new THREE.LineBasicMaterial({ color: COR_LINHA });
    const matLinhaVidro = new THREE.LineBasicMaterial({ color: COR_LINHA_VIDRO, transparent: true, opacity: 0.5 });

    // logo: sprite sempre de frente pra câmera, some/aparece depois da casa montar
    const texturaLogo = new THREE.TextureLoader().load(ARQUIVO_LOGO);
    texturaLogo.colorSpace = THREE.SRGBColorSpace;   // sem isso a imagem sai "estourada"/lavada
    const logo = new THREE.Sprite(new THREE.SpriteMaterial({ map: texturaLogo, transparent: true }));
    logo.scale.set(ESCALA_LOGO, ESCALA_LOGO * (314 / 512), 1);   // proporção real da imagem (512x314)
    logo.visible = false;
    cena.add(logo);

    // ----------------------------------------------------------- carregamento
    const pecas = [];   // { obj, origem, destino, inicio }
    let inicioAnimacao = 0;
    let duracaoTotal = 0;
    let logoIniciada = false;
    let logoInicio = 0;
    let logoOrigem = new THREE.Vector3();
    let logoDestino = new THREE.Vector3();

    new GLTFLoader().load(ARQUIVO_GLB, (gltf) => {
      const raiz = gltf.scene;

      raiz.traverse((no) => {
        if (!no.isMesh) return;
        const ehVidro = (no.material?.name || '').toLowerCase().includes('vidro');
        no.material = ehVidro ? matVidro : matFace;
        const arestas = new THREE.LineSegments(
          new THREE.EdgesGeometry(no.geometry, ANGULO_ARESTA),
          ehVidro ? matLinhaVidro : matLinha,
        );
        no.add(arestas);   // filho do mesh, então segue posição e animação
      });

      // objetos de topo do Blender trazem explode_vec e explode_ordem em userData
      raiz.traverse((no) => {
        const v = no.userData.explode_vec;
        if (!v) return;
        // Blender é Z para cima, glTF é Y para cima: (x, y, z) vira (x, z, -y)
        const vetor = new THREE.Vector3(v[0], v[2], -v[1]).multiplyScalar(FATOR_EXPLOSAO);
        pecas.push({
          obj: no,
          destino: no.position.clone(),
          origem: no.position.clone().add(vetor),
          inicio: (no.userData.explode_ordem ?? 0),
        });
      });

      // montar: base (ordem maior) chega primeiro, telhado por último
      const ordemMax = Math.max(...pecas.map((p) => p.inicio));
      for (const p of pecas) p.inicio = (ordemMax - p.inicio) * ATRASO_POR_ORDEM;
      duracaoTotal = ordemMax * ATRASO_POR_ORDEM + DURACAO_PECA;

      cena.add(raiz);
      reiniciar();
    });

    // -------------------------------------------------------------- animação
    const suavizar = (t) => 1 - Math.pow(1 - t, 3);   // ease-out cúbico

    function reiniciar() {
      inicioAnimacao = performance.now() / 1000;
      if (reduzirMovimento) inicioAnimacao -= duracaoTotal;   // pula direto para a casa montada
      logoIniciada = false;
      logo.visible = false;
      controles.enabled = true;
    }
    document.getElementById('replay').addEventListener('click', reiniciar);

    function quadro() {
      const t = performance.now() / 1000 - inicioAnimacao;
      for (const p of pecas) {
        const k = THREE.MathUtils.clamp((t - p.inicio) / DURACAO_PECA, 0, 1);
        p.obj.position.lerpVectors(p.origem, p.destino, suavizar(k));
      }

      // logo: entra de trás da câmera assim que a casa termina de montar
      if (!logoIniciada && duracaoTotal > 0 && t >= duracaoTotal) {
        logoIniciada = true;
        // com "reduzir movimento", pula direto pra logo já no lugar, sem animar a entrada
        logoInicio = reduzirMovimento ? t - DURACAO_LOGO : t;
        logo.visible = true;
        controles.enabled = reduzirMovimento;

        const frente = new THREE.Vector3();
        camera.getWorldDirection(frente);
        logoOrigem.copy(camera.position).addScaledVector(frente, -DIST_LOGO_ATRAS);
        logoDestino.copy(camera.position).addScaledVector(frente, DIST_LOGO_FRENTE);
        logo.position.copy(logoOrigem);
      }
      if (logoIniciada) {
        const kLogo = THREE.MathUtils.clamp((t - logoInicio) / DURACAO_LOGO, 0, 1);
        logo.position.lerpVectors(logoOrigem, logoDestino, suavizar(kLogo));
        if (kLogo === 1) controles.enabled = true;   // libera a câmera quando a logo chega
      }

      controles.update();
      renderer.render(cena, camera);
      requestAnimationFrame(quadro);
    }
    quadro();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>

</html>
